<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كرنفال على فين – Get your ticket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#fdf6e6;--ink:#10303f;--mute:#506873;--card:#fff;--line:#e6d9b8;--accent:#1d7fb5;--on-accent:#fff;--pop:#e0452a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2a37;--ink:#fdf3dc;--mute:#9fb7c2;--card:#16394a;--line:#2c5568;--accent:#f0a82a;--on-accent:#10303f;--pop:#ff6a4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2a37;--ink:#fdf3dc;--mute:#9fb7c2;--card:#16394a;--line:#2c5568;--accent:#f0a82a;--on-accent:#10303f;--pop:#ff6a4d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:40px 20px 120px}
h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0 0 16px}
.lead{font-size:1.15rem;color:var(--mute);max-width:46ch;margin:0 0 36px}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--card);border:2px solid var(--ink);border-radius:18px;margin-bottom:18px;position:relative;overflow:hidden}
.ticket .info{padding:20px}
.ticket .date{display:inline-block;background:var(--pop);color:#fff;font-weight:800;border-radius:8px;padding:2px 10px;margin-bottom:10px}
.ticket h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.02em}
.ticket p{margin:0;color:var(--mute)}
.stub{border-left:2px dashed var(--ink);padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:132px}
.stub::before,.stub::after{content:"";position:absolute;right:calc(132px - 11px);width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.stub::before{top:-12px}.stub::after{bottom:-12px}
.price{font-weight:800;font-size:1.3rem}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.qty output{min-width:1.5ch;text-align:center;font-weight:800}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:36px 0 0}
legend{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.pay{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;color:var(--mute)}
.pay strong{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.bar span{font-weight:800;font-size:1.15rem}
.bar button{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:800;cursor:pointer}
.bar button:disabled{opacity:.45;cursor:not-allowed}
#err{color:var(--pop);font-weight:600;min-height:1.5em;margin-top:10px}
[hidden]{display:none!important}
.logo{display:block;width:min(52vw,230px);height:auto;margin:0 0 18px}
.btnlink{display:inline-block;margin:12px 10px 0 0;background:var(--accent);color:var(--on-accent);padding:12px 20px;border-radius:999px;font-weight:800;text-decoration:none}
@media (max-width:480px){.stub{min-width:112px;padding:16px 10px}.stub::before,.stub::after{right:calc(112px - 11px)}}
</style>
</head>

  <h1>كرنفال على فين</h1>
  <p class="lead">Choose how many tickets you want, pick your church, and pay with Instapay. We confirm on WhatsApp and send your ticket.</p>

  <section id="events" aria-label="Events"></section>

  <fieldset>
    <legend>Your details</legend>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name">
    <label for="church">Your church</label>
    <input id="church" list="churches" placeholder="Choose or type your church name">
    <datalist id="churches"></datalist>
    <label for="phone">WhatsApp number</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx">
    <div class="pay" id="payinfo"></div>
    <div id="err" role="alert"></div>
    <div class="pay" id="done" hidden><strong>Step 2:</strong> after you pay on Instapay, send your payment screenshot so we can issue your ticket.<br><a class="btnlink" id="ip" target="_blank" rel="noopener">Open Instapay</a><a class="btnlink" id="wa" href="#">Send screenshot on WhatsApp</a></div>
  </fieldset>
</main>

<div class="bar">
  <span id="total">0 EGP</span>
  <button id="go" disabled>Pay with Instapay</button>
</div>

<script>
/* ===== EDIT THIS SECTION ===== */
var CONFIG={
  whatsapp:"201274633352",
  churches:["Saint Mary & Saint John"],   // add more churches here; people can also type their own
  instapay:"bishoygeorgerezk@instapay",
  instapayLink:"https://ipn.eg/S/bishoygeorgerezk/instapay/0p2ZMk",
  events:[
    {id:"e1",title:"كرنفال على فين",date:"Sat 5 Dec",place:"Saint Mary & Saint John · 1:00 PM",price:50}
  ]
};
/* ============================= */
var qty={};
var box=document.getElementById("events");
CONFIG.events.forEach(function(e){
  qty[e.id]=0;
  var el=document.createElement("article");el.className="ticket";
  el.innerHTML='<div class="info"><span class="date"></span><h2></h2><p></p></div>'+
   '<div class="stub"><div class="price"></div><div class="qty"><button type="button" data-d="-1" aria-label="Fewer tickets">−</button><output aria-live="polite">0</output><button type="button" data-d="1" aria-label="More tickets">+</button></div></div>';
  el.querySelector(".date").textContent=e.date;
  el.querySelector("h2").textContent=e.title;
  el.querySelector("p").textContent=e.place;
  el.querySelector(".price").textContent=e.price+" EGP";
  el.querySelectorAll("button").forEach(function(b){
    b.onclick=function(){
      qty[e.id]=Math.max(0,Math.min(10,qty[e.id]+Number(b.dataset.d)));
      el.querySelector("output").textContent=qty[e.id];
      update();
    };
  });
  box.appendChild(el);
});
function total(){return CONFIG.events.reduce(function(s,e){return s+qty[e.id]*e.price},0)}
function update(){
  var t=total();
  document.getElementById("total").textContent=t+" EGP";
  document.getElementById("go").disabled=t===0;
}
function payinfo(){
  var dl=document.getElementById("churches");
  CONFIG.churches.forEach(function(c){var o=document.createElement("option");o.value=c;dl.appendChild(o)});
  document.getElementById("payinfo").innerHTML="Payment is by <strong>Instapay</strong> only. Instapay address: <strong></strong>";
  document.querySelector("#payinfo strong:last-of-type").textContent=CONFIG.instapay;
  document.getElementById("ip").href=CONFIG.instapayLink;
}
payinfo();
document.getElementById("go").onclick=function(){
  var n=document.getElementById("name").value.trim();
  var p=document.getElementById("phone").value.trim();
  var ch=document.getElementById("church").value.trim();
  var err=document.getElementById("err");
  if(!n||!ch||p.replace(/\D/g,"").length<10){err.textContent="Enter your full name, your church, and a valid WhatsApp number.";return}
  err.textContent="";
  var lines=CONFIG.events.filter(function(e){return qty[e.id]>0}).map(function(e){return qty[e.id]+" × "+e.title+" ("+e.date+")"});
  var msg="Hi! I’d like to book:\n"+lines.join("\n")+"\nTotal: "+total()+" EGP\nName: "+n+"\nChurch: "+ch+"\nPhone: "+p+"\nPaid by Instapay";
  document.getElementById("wa").href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
  document.getElementById("done").hidden=false;
  document.getElementById("done").scrollIntoView({behavior:"smooth"});
  window.open(CONFIG.instapayLink,"_blank");
};
</script>
</body>
